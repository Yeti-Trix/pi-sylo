<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sylo</title>
    <style>
      :root {
        --bg: #0f1115;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #6b9fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
      }
      h1 span.accent {
        color: var(--accent);
      }
      p {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.2;
        color: var(--muted);
        text-align: center;
      }
      .dots {
        animation: breathe 1.2s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <h1><span class="accent">Sylo</span></h1>
      <p>Starting<span class="dots">…</span></p>
    </div>
  </body>
</html>
